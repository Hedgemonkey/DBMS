{% extends 'base.html' %}

{% block content %}
<h3 class="light-blue-text text-darken-4 center-align">Edit Task</h3>
<div class="row card-panel grey lighten-5">
    <form class="col s12" method="POST" action="{{ url_for('edit_task', task_id=task.id) }}">
        <!--- Task Name --->
        <div class="row">
            <div class="input-field col s12">
                <i class="fas fa-folder-open prefix light-blue-text text-drken-4"></i>
                <input id="task_name" name="task_name" type="text" value="{{ task.task_name }}" minlength="3" maxlength="25" class="validate"
                    required>
                <label for="task_name">Task Name</label>
            </div>
        </div>
        <!--- Task Description --->
        <div class="row">
            <div class="input-field col s12">
                <i class="fas fa-align-left prefix light-blue-text text-darken-4"></i>
                <textarea id="task_description" name="task_description" class="materialize-textarea validate"
                    minlength="5" maxlength="255" required>{{ task.task_description }}</textarea>
                <label for="task_description">Task Description</label>
            </div>
        </div>
        <!--- Task Due Date --->
        <div class="row">
            <div class="input-field col s12">
                <i class="fas fa-calendar-alt prefix light-blue-text text-darken-4"></i>
                <input id="due_date" name="due_date" type="text" class="datepicker validate"  value="{{ task.due_date }}" required>
                <label for="due_date">Due Date</label>
            </div>
        </div>
        <!--- Is Urgent --->
        <div class="row">
            <div class="input-field col s12">
                <div class="switch">
                    <label for="is_urgent">
                        <input id="is_urgent" name="is_urgent" type="checkbox" {% if task.is_urgent %} checked {% endif %}>
                        <span class="lever"></span>
                        Is Urgent
                    </label>
                </div>
            </div>
        </div>
        <!--- Task Category --->
        <div class="row">
            <div class="input-field col s12">
                <i class="fas fa-folder-open prefix light-blue-text text-darken-4"></i>
                <select id="category_id" name="category_id" required>
                    <option value="" disabled selected>Choose a Category</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}" {% if category.id == task.category.id %} selected {% endif %}>{{ category.category_name }}</option>
                    {% endfor %}
                </select>
                <label for="category_id">Category</label>
            </div>
        </div>
        <!--- Submit Button --->
        <div class="row">
            <div class="col s12 center-align">
                <button type="submit" class="btn-large blue darken-2">
                    Edit Task <i class="fas fa-edit right"></i>
                </button>
            </div>
        </div>


    </form>
</div>
{% endblock %}
